<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Aurora interactiva</title>
<style>
  :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#050817; }
  body { position:relative; isolation:isolate; }
  .sky { position:absolute; inset:-12%; overflow:hidden; background:radial-gradient(ellipse at 50% 110%,#132248 0%,#081127 44%,#050817 78%); transition:filter .7s ease; }
  .stars, .stars::before, .stars::after { position:absolute; inset:0; content:""; background-image:radial-gradient(1px 1px at 8% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 23% 62%,#d7eaff 98%,transparent),radial-gradient(1px 1px at 42% 15%,#fff 98%,transparent),radial-gradient(1px 1px at 74% 24%,#c6eaff 98%,transparent),radial-gradient(1px 1px at 89% 58%,#fff 98%,transparent),radial-gradient(1px 1px at 64% 76%,#d7eaff 98%,transparent),radial-gradient(1px 1px at 34% 84%,#fff 98%,transparent); background-size:510px 390px; opacity:.47; }
  .stars::before { transform:translate(170px,110px) scale(1.35); opacity:.35; }
  .stars::after { transform:translate(-90px,65px) scale(.8); opacity:.4; }
  .glow { position:absolute; width:80vw; height:50vw; min-width:760px; min-height:470px; border-radius:50%; filter:blur(80px); opacity:.67; mix-blend-mode:screen; will-change:transform; }
  .glow.one { left:-17%; top:4%; background:radial-gradient(ellipse,rgba(28,237,190,.75) 0%,rgba(28,237,190,.25) 37%,transparent 69%); animation:drift1 18s ease-in-out infinite alternate; }
  .glow.two { right:-23%; top:0; background:radial-gradient(ellipse,rgba(120,72,255,.68) 0%,rgba(51,116,255,.27) 42%,transparent 72%); animation:drift2 23s ease-in-out infinite alternate; }
  .glow.three { width:72vw; height:35vw; left:23%; top:23%; background:radial-gradient(ellipse,rgba(255,53,184,.39) 0%,rgba(48,178,255,.2) 45%,transparent 71%); animation:drift3 26s ease-in-out infinite alternate; }
  .ribbon { position:absolute; width:130%; height:54%; left:-15%; top:1%; border-radius:0 0 50% 50%; border-bottom:1px solid rgba(197,255,239,.16); filter:blur(2px); transform:rotate(-9deg); opacity:.55; box-shadow:0 24px 60px rgba(42,255,208,.055),0 44px 100px rgba(115,73,255,.07); }
  .horizon { position:absolute; left:-10%; right:-10%; bottom:-28%; height:58%; border-radius:50% 50% 0 0; background:radial-gradient(ellipse at 50% 0%,rgba(39,74,121,.45),rgba(7,14,34,.82) 57%,#050817 78%); box-shadow:0 -20px 85px rgba(41,113,154,.12); }
  .grain { position:absolute; inset:0; pointer-events:none; opacity:.12; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E"); }
  .quiet .glow, .quiet .ribbon { animation-play-state:paused !important; }
  .quiet .sky { filter:saturate(.72) brightness(.87); }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(24px,5vw,68px); pointer-events:none; }
  .brand { color:rgba(238,246,255,.63); font-size:11px; letter-spacing:.24em; text-transform:uppercase; }
  .center { align-self:center; text-align:center; margin-top:-1vh; text-shadow:0 4px 30px rgba(0,0,0,.3); }
  h1 { margin:0; color:#f2f7ff; font-size:clamp(35px,6.7vw,88px); line-height:1.02; font-weight:350; letter-spacing:-.055em; }
  .subtitle { margin:20px 0 0; color:rgba(227,239,255,.67); font-size:clamp(12px,1.4vw,16px); letter-spacing:.12em; }
  .bottom { display:flex; justify-content:space-between; align-items:end; gap:20px; color:rgba(230,240,255,.48); font-size:11px; letter-spacing:.08em; }
  .hint { pointer-events:none; }
  button { pointer-events:auto; display:flex; align-items:center; gap:11px; min-height:46px; padding:0 17px; border:1px solid rgba(220,239,255,.22); border-radius:999px; color:#eef6ff; background:rgba(9,16,37,.38); backdrop-filter:blur(14px); font:500 13px "Segoe UI",system-ui,sans-serif; cursor:pointer; transition:background .2s,border-color .2s,transform .2s; }
  button:hover { background:rgba(29,45,77,.58); border-color:rgba(220,239,255,.48); transform:translateY(-1px); }
  button:focus-visible { outline:2px solid #a9ffe9; outline-offset:4px; }
  .icon { width:14px; height:14px; display:inline-flex; align-items:center; justify-content:center; }
  .icon::before { content:""; display:block; width:3px; height:12px; background:#a9ffe9; box-shadow:6px 0 #a9ffe9; border-radius:2px; }
  .quiet .icon::before { width:0; height:0; margin-left:3px; border-top:7px solid transparent; border-bottom:7px solid transparent; border-left:10px solid #a9ffe9; background:none; box-shadow:none; }
  @keyframes drift1 { from{transform:translate(-4%,0) rotate(-8deg) scale(1)} to{transform:translate(12%,8%) rotate(8deg) scale(1.16)} }
  @keyframes drift2 { from{transform:translate(4%,-3%) rotate(8deg) scale(1.08)} to{transform:translate(-12%,10%) rotate(-7deg) scale(.96)} }
  @keyframes drift3 { from{transform:translate(-4%,5%) rotate(4deg)} to{transform:translate(8%,-8%) rotate(-6deg)} }
  @media(max-width:600px){ .overlay{padding:24px}.bottom{align-items:center}.hint{display:none}.glow{filter:blur(56px)} }
  @media(prefers-reduced-motion:reduce){ .glow,.ribbon{animation-play-state:paused !important} }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="stars"></div><div class="glow one"></div><div class="glow two"></div><div class="glow three"></div><div class="ribbon"></div><div class="horizon"></div><div class="grain"></div></div>
<main class="overlay">
  <div class="brand">AURORA · FONDO INTERACTIVO</div>
  <section class="center" aria-label="Fondo animado de aurora">
    <h1>Respira.<br>Todo fluye.</h1>
    <p class="subtitle">Una aurora tranquila para tu espacio.</p>
  </section>
  <div class="bottom">
    <span class="hint">Pulsa el botón o usa la barra espaciadora</span>
    <button id="toggle" type="button" aria-pressed="false" aria-label="Apagar animación">
      <span class="icon" aria-hidden="true"></span><span id="label">Animación encendida</span>
    </button>
  </div>
</main>
<script>
  (() => {
    const body = document.body;
    const button = document.getElementById('toggle');
    const label = document.getElementById('label');
    let paused = false;
    function setPaused(value) {
      paused = value;
      body.classList.toggle('quiet', paused);
      label.textContent = paused ? 'Animación apagada' : 'Animación encendida';
      button.setAttribute('aria-pressed', String(paused));
      button.setAttribute('aria-label', paused ? 'Encender animación' : 'Apagar animación');
    }
    button.addEventListener('click', () => setPaused(!paused));
    window.addEventListener('keydown', event => {
      if (event.code === 'Space' && !['BUTTON','INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
        event.preventDefault(); setPaused(!paused);
      }
    });
  })();
</script>
</body>
</html>
