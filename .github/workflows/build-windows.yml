name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/FondoClaro.csproj
        working-directory: FondoClaro
      - name: Publish self-contained Windows x64 app
        run: dotnet publish src/FondoClaro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
        working-directory: FondoClaro
      - name: Create distributable zip
        shell: pwsh
        run: Compress-Archive -Path FondoClaro/publish/* -DestinationPath FondoClaro-win-x64.zip -Force
      - name: Upload executable and package
        uses: actions/upload-artifact@v4
        with:
          name: FondoClaro-win-x64
          path: |
            FondoClaro/publish/FondoClaro.exe
            FondoClaro-win-x64.zip
          if-no-files-found: error
          retention-days: 30
